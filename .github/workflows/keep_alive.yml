name: 24/7 Cloud Bot Keep-Alive

on:
  schedule:
    # Ping every 15 minutes 24/7 to keep Hugging Face Space alive permanently
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space Health Endpoint
        run: |
          echo "Pinging 16GB RAM Hugging Face Space to ensure 24/7 uptime..."
          curl -f -s -m 30 https://farbod1488888-my-24-bot.hf.space/health || true
